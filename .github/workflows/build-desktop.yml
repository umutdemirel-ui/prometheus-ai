name: Build Prometheus Desktop Apps

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: PrometheusAI-Windows.exe
            built_path: dist/PrometheusAI.exe
          - os: macos-latest
            artifact: PrometheusAI-macOS
            built_path: dist/PrometheusAI
          - os: ubuntu-latest
            artifact: PrometheusAI-Linux
            built_path: dist/PrometheusAI

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-desktop.txt
      - name: Build desktop executable
        run: python build_desktop.py
      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.built_path }}
