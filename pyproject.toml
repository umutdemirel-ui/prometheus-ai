[project]
name = "prometheus-ai"
version = "1.0.0"
description = "Tony Stark JARVIS-inspired free, full-authority desktop & voice AI assistant"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "psutil>=6.0.0",
    "httpx>=0.27.0",
    "edge-tts>=6.1.12",
    "websockets>=12.0",
    "pydantic>=2.7.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
